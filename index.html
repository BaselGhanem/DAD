<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8fa">
  <title>Executive Dashboards | Dar Al Dawa</title>
  <link rel="stylesheet" href="assets/executive.css">
</head>
<body>
  <header class="masthead">
    <span class="brand">Dar Al Dawa</span>
  </header>
  <main class="portal">
    <section class="content" aria-labelledby="portal-title">
      <h1 id="portal-title">Executive <span>Dashboards</span></h1>
      <p class="intro">Choose a workspace to view its reports.</p>
      <nav aria-label="Executive workspaces">
        <ul class="workspaces">
          <li>
            <a class="workspace workspace--ceo" href="./CEO/" aria-labelledby="ceo-title" aria-describedby="ceo-scope">
              <span class="workspace-icon icon-compass" aria-hidden="true"></span>
              <span class="workspace-copy">
                <span class="workspace-title" id="ceo-title"><strong>CEO</strong> <span>Chief Executive Officer</span></span>
                <span class="scope" id="ceo-scope">Company performance and strategy</span>
              </span>
              <span class="workspace-arrow" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a class="workspace workspace--cfo" href="./CFO/" aria-labelledby="cfo-title" aria-describedby="cfo-scope">
              <span class="workspace-icon icon-chart" aria-hidden="true"></span>
              <span class="workspace-copy">
                <span class="workspace-title" id="cfo-title"><strong>CFO</strong> <span>Chief Financial Officer</span></span>
                <span class="scope" id="cfo-scope">Financial performance and planning</span>
              </span>
              <span class="workspace-arrow" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a class="workspace workspace--cco" href="./CCO/" aria-labelledby="cco-title" aria-describedby="cco-scope">
              <span class="workspace-icon icon-growth" aria-hidden="true"></span>
              <span class="workspace-copy">
                <span class="workspace-title" id="cco-title"><strong>CCO</strong> <span>Chief Commercial Officer</span></span>
                <span class="scope" id="cco-scope">Sales performance and market growth</span>
              </span>
              <span class="workspace-arrow" aria-hidden="true"></span>
            </a>
          </li>
        </ul>
      </nav>
    </section>
    <div class="facility">
      <img src="assets/dad-facility.webp" alt="" fetchpriority="high">
    </div>
  </main>
</body>
</html>
